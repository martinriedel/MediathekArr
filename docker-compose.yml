services:
  mediathekarr:
    image: pcjones/mediathekarr:beta
    restart: unless-stopped
    container_name: mediathekarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Berlin
      # You can use the web interface at http://localhost:5007 to configure the following settings
      # Alternatively, you can set them here
      #- DOWNLOAD_INCOMPLETE_PATH=/data/mediathek/incomplete # Path to incomplete downloads
      #- DOWNLOAD_COMPLETE_PATH=/data/mediathek/complete # Path to complete downloads
      #- CATEGORIES=tv,movies,sonarr_blackhole,radarr_blackhole # Comma separated list of categories to expose
      #- MAX_PARALLEL_DOWNLOADS=2 # Number of parallel downloads (1-10, default: 2)

      # Only change this if you are hosting your own API. Not needed for 99% of users
      - MEDIATHEKARR_API_BASE_URL=https://mediathekarr.pcjones.de/api/v1
      # Use your own rulesets (see the mediathekarr-rulesets service below)
      #- MEDIATHEKARR_RULESETS_URL=http://mediathekarr-rulesets:5008/api/v1/rulesets
      # ...and its show data from TVDB (needs TVDB_API_KEY on the ruleset service) instead of pcjones.de
      #- MEDIATHEKARR_API_BASE_URL=http://mediathekarr-rulesets:5008/api/v1
    volumes:
      - /docker/appdata/mediathekarr:/app/config
      - /data/mediathek/complete:/data/mediathek/complete
      - /data/mediathek/incomplete:/data/mediathek/incomplete
    ports:
      - "127.0.0.1:5007:5007" # Port on the left side can be changed to any value you like

  # Optional: self-hosted ruleset service with automatic generation (see MediathekArrRulesets/README.md)
  #mediathekarr-rulesets:
  #  image: ghcr.io/martinriedel/mediathekarr-rulesets:latest
  #  restart: unless-stopped
  #  container_name: mediathekarr-rulesets
  #  environment:
  #    - RULESETS_API_KEY=change-me
  #    - TVDB_API_KEY=
  #    - LLM_BASE_URL=http://host.docker.internal:11434/v1 # e.g. Ollama
  #    - LLM_MODEL=qwen2.5:14b
  #    - SONARR_URL=http://sonarr:8989
  #    - SONARR_API_KEY=
  #    - GENERATE_INTERVAL_HOURS=24
  #  volumes:
  #    - /docker/appdata/mediathekarr-rulesets:/data
  #  ports:
  #    - "127.0.0.1:5008:5008"
